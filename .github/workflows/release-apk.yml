name: Build and release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 37 and build-tools 37.0.0
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          # Accept licenses before installing so sdkmanager does not block.
          yes | sdkmanager --licenses >/dev/null || true

          packages=()
          # Current SDK repository names API 37 "platforms;android-37.0"
          # (there is no "platforms;android-37" package). Install that when
          # the runner image does not already have an API 37 platform.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            packages+=("platforms;android-37.0")
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/37.0.0" ]; then
            packages+=("build-tools;37.0.0")
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            # A newly introduced license can prompt. pipefail is off so SIGPIPE
            # from `yes` does not fail the step after sdkmanager exits.
            set +o pipefail
            yes | sdkmanager --install "${packages[@]}"
            status=$?
            set -o pipefail
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          else
            echo "platform 37 and build-tools 37.0.0 already present"
          fi

      - name: Read versionName
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$version" ]; then
            echo "versionName not found in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "asset=Luna-v$version.apk" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK asset
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "Signed release APK not found at $src" >&2
            find app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          cp "$src" "${{ steps.version.outputs.asset }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Luna ${{ steps.version.outputs.tag }}
          make_latest: "true"
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Luna ${{ steps.version.outputs.name }} 安装包。

            下载附件 `${{ steps.version.outputs.asset }}`，在手机上允许安装未知来源应用后安装。
            签名密钥与 1.0.2 相同，可以直接覆盖安装。
          files: ${{ steps.version.outputs.asset }}
          token: ${{ secrets.GITHUB_TOKEN }}
